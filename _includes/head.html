<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {%- assign is_home = false -%}
  {%- if page.url == '/' -%}{%- assign is_home = true -%}{%- endif -%}
  <title>{% if is_home %}{{ site.title }} — {{ site.tagline }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>

  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta name="author" content="{{ site.author }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- Open Graph -->
  <meta property="og:type" content="{% if is_home %}website{% else %}article{% endif %}">
  <meta property="og:title" content="{% if is_home %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | strip_newlines | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23E07B39'/%3E%3Ctext x='16' y='22' font-family='Georgia,serif' font-size='15' font-weight='700' fill='%23FAF6EF' text-anchor='middle'%3EAA%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Adel Malik Annabi",
    "jobTitle": "PhD in Mathematics",
    "affiliation": {
      "@type": "Organization",
      "name": "Université Côte d'Azur — Laboratoire J.A. Dieudonné, Inria"
    },
    "email": "mailto:{{ site.email }}",
    "url": "{{ '/' | absolute_url }}",
    "knowsAbout": ["Estimation", "Nonlinear observer design", "Control theory", "Optimal control", "Control theory and its applications"]
  }
  </script>
</head>
